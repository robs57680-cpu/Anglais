@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--fg:#eee;--cd:#242a33;--ac:#6b9bff}}

body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;max-width:640px;margin:auto;padding:12px}
nav{display:flex;gap:6px;margin-bottom:12px}nav button{flex:1;padding:10px 2px;font-size:14px}
button,select,input{font:inherit;color:var(--fg);background:var(--cd);border:1px solid transparent;border-radius:10px;padding:10px;margin:3px 0}

const SENT=`Respirez profondément.|breathe deeply
Ouvrez votre bouche.|open your mouth
Ne toussez pas.|don’t cough
Allongez-vous sur le lit.|lie down on the bed
J’ai mal à la jambe.|my leg hurts
Je suis encore sous perfusion.|I’m still on a drip
L’infirmière va changer la perfusion.|the nurse is going to change the drip
Vous allez devoir réduire les graisses.|you are going to have to cut down on fats
Je vais prendre une douche.|I am going to have a shower
Elle a fait une prise de sang.|she took a blood sample
Le chirurgien a utilisé un scalpel.|the surgeon used a scalpel
Avez-vous pris votre médicament ?|have you taken your medication
Avez-vous fait le pansement ?|did you do the dressing
L’infirmière vérifiera la tension artérielle.|the nurse will check the blood pressure
Ma famille me manque.|I miss my family
Il a fait un AVC.|he had a stroke
C’est un gros fumeur.|he is a heavy smoker
Prenez ce sirop 3 ou 4 fois par jour.|take this syrup 3 or 4 times daily
Le patient est sous surveillance médicale.|the patient is under medical supervision
Il ne peut pas se lever tout seul.|he can’t get up on his own
Appliquez de la pommade sur la peau.|rub some ointment on the skin
Le patient n’a pas le droit de manger.|the patient is not allowed to eat
Elle suit un régime.|she is on a diet
Je n’ai pas pris de douche.|I have not taken a shower
Je suis allergique à ce médicament.|I’m allergic to this medication`;
const U={};let cu;RAW.split('\n').forEach(l=>{if(l[0]=='#')U[cu=l.slice(1)]=[];else U[cu].push(l.split('='))});
const ALL=Object.values(U).flat(),$=id=>document.getElementById(id),V=$('v');
const sh=a=>[...a].sort(()=>Math.random()-.5);
const nm=s=>s.toLowerCase().replace(/œ/g,'oe').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
const acc=q=>ALL.filter(e=>e[q.d]==q.e[q.d]).map(e=>e[1-q.d]);
const good=(q,a)=>acc(q).some(c=>[c,...c.split(/[\/,]/)].some(v=>nm(v)==nm(a)&&nm(a)));
const opts=(u,m)=>`<select id="u"><option value="*">Aléatoire (tout)</option>${Object.keys(U).map(k=>`<option>${k}</option>`).join('')}</select><select id="dir"><option value="0">Anglais → Français</option><option value="1">Français → Anglais</option><option value="m">Mixte</option></select><button class="go" onclick="start('${m}')">Commencer</button>`;
function tab(i){[...document.querySelectorAll('nav button')].forEach((b,j)=>b.classList.toggle('on',i==j));
if(i==0)gl();else if(i==3){P=[];ph()}else V.innerHTML=`<h3>${i==1?'Révision QCM':'Examen (saisie)'}</h3>`+opts(0,i==1?'q':'x')+'<p>Une série = 30 mots max (20 en aléatoire). Un mot raté peut revenir plus tard dans la série.</p>'}
function gl(){V.innerHTML=`<input id="s" placeholder="Rechercher…" oninput="fl()"><select id="g" onchange="fl()"><option value="">Toutes les unités</option>${Object.keys(U).map(k=>`<option>${k}</option>`).join('')}</select><div id="l"></div>`;fl()}
function fl(){const s=nm($('s').value),g=$('g').value;$('l').innerHTML=Object.entries(U).filter(([k])=>!g||k==g).map(([k,a])=>{const r=a.filter(e=>!s||nm(e[0]+' '+e[1]).includes(s));return r.length?`<h4>${k}</h4>`+r.map(e=>`<div class="r"><span>${e[0]}</span><b>${e[1]}</b></div>`).join(''):''}).join('')}
let S;
function start(m){const u=$('u').value,d=$('dir').value,p=sh(u=='*'?ALL:U[u]).slice(0,u=='*'?20:30);S={m,u,n:p.length,ok:0,q:p.map(e=>({e,d:d=='m'?+(Math.random()<.5):+d,t:0}))};nx()}
function nx(){if(!S.q.length)return end();const q=S.q[0],pr=q.e[q.d];let h=`<p>${S.n-S.q.length+1>S.n?S.n:S.q.length} restant(s)</p><div class="q">${pr}</div>`;
if(S.m=='q'){const a=acc(q),w=sh(ALL.map(e=>e[1-q.d]).filter(x=>!a.includes(x)&&!a.some(y=>nm(y)==nm(x)))).filter((x,i,r)=>r.indexOf(x)==i).slice(0,3);q.o=sh([q.e[1-q.d],...w]);h+=q.o.map((o,i)=>`<button class="o" onclick="an(${i})">${o}</button>`).join('')}
else h+=`<input id="a" autocomplete="off" autocapitalize="off" placeholder="Ta réponse"><button class="go" onclick="an()">Valider</button>`;V.innerHTML=h+'<div id="fb"></div>';if($('a')){$('a').focus();$('a').onkeydown=e=>e.key=='Enter'&&an()}}
function an(i){if(S.lock)return;const q=S.q[0],val=i==null?$('a').value:q.o[i],g=good(q,val);S.lock=1;
if(g&&!q.t)S.ok++;S.q.shift();if(!g&&Math.random()<.5)S.q.splice(Math.min(2,S.q.length)+Math.floor(Math.random()*Math.max(1,S.q.length-1)),0,{e:q.e,d:q.d,t:1});
if(i!=null)document.querySelectorAll('.o').forEach((b,j)=>{if(good(q,q.o[j]))b.classList.add('ok');else if(j==i)b.classList.add('ko')});
$('fb').innerHTML=`<div class="f ${g?'ok':'ko'}">${g?'✅ Bonne réponse':'❌ Faux'} : <b>${q.e[0]}</b> = <b>${q.e[1]}</b></div><button class="go" id="nb" onclick="S.lock=0;nx()">Suivant</button>`;$('nb').focus()}
function end(){let k='b'+S.m+S.u,b=0;try{b=+localStorage.getItem(k)||0}catch(e){}const sc=Math.round(100*S.ok/S.n);if(sc>b){b=sc;try{localStorage.setItem(k,sc)}catch(e){}}
V.innerHTML=`<div class="q">Série terminée<br>${S.ok}/${S.n} du premier coup (${sc} %)</div><p style="text-align:center">Meilleur score (${S.u=='*'?'aléatoire':S.u}) : ${b} %</p><button class="go" onclick="tab(${S.m=='q'?1:2})">Rejouer</button>`}
let P=[],c;
function ph(){if(!P.length)P=sh(SENT.split('\n'));const[f,e]=P.pop().split('|');c={f,e,t:e.split(' '),a:[],done:0};c.p=sh(c.t.map((_,i)=>i));dp()}
function dp(){V.innerHTML=`<h3>Remets les mots dans l’ordre</h3><div class="q">${c.f}</div><div class="box">${c.a.map(i=>`<button class="ch" onclick="mv(${i},0)">${c.t[i]}</button>`).join('')}</div><div>${c.p.map(i=>`<button class="ch" onclick="mv(${i},1)">${c.t[i]}</button>`).join('')}</div><div id="fb"></div><button class="go" onclick="vp()">Valider</button>`}
function mv(i,t){if(c.done)return;if(t){c.p=c.p.filter(x=>x!=i);c.a.push(i)}else{c.a=c.a.filter(x=>x!=i);c.p.push(i)}dp()}
function vp(){if(c.done)return;c.done=1;const g=c.a.map(i=>c.t[i]).join(' ')==c.e;$('fb').innerHTML=`<div class="f ${g?'ok':'ko'}">${g?'✅ Ordre correct !':'❌ Ordre incorrect'}<br>${c.e}</div><button class="go" onclick="ph()">Phrase suivante</button>`}
tab(0);
</script></body></html>
